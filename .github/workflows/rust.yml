name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  release_build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - name: Format
      run: cargo fmt --all --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets --release -- -D warnings
    - name: Test
      run: cargo test --verbose --workspace --release
    - name: Build
      run: cargo build --verbose --workspace --release
    - uses: actions/upload-artifact@v4
      with:
        name: nexo-x86_64-pc-windows-msvc
        path: target/release/nexo.exe
        retention-days: 2

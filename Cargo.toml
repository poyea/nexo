[workspace]
members = ["crates/core", "crates/gmail", "crates/mail", "crates/telegram"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["John Law <poyea@pm.me>"]
license = "MIT"
repository = "https://github.com/poyea/nexo/"
homepage = "https://github.com/poyea/nexo/"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "nexo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Collects your messages from many channels into one folder, and sends the replies that you write there."
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
categories = ["gui"]
publish = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
glasskit = "0.11"
keyring-core = "1"
nexo-core = { path = "crates/core" }
nexo-gmail = { path = "crates/gmail" }
nexo-mail = { path = "crates/mail" }
nexo-telegram = { path = "crates/telegram" }
serde.workspace = true
serde_json.workspace = true
toml = "1"
toml_edit = "0.25"
windows-native-keyring-store = "1.1"

[build-dependencies]
embed-manifest = "1.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
